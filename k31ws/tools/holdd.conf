# holdd-ws.conf (sourced every loop). 2026-11-18 user: cancelling nodes while work is queued is unacceptable.
# The daemon NEVER releases a running hold (idle limits effectively infinite); holds end only at their time limit or by
# Slurm preemption (backfill). TB = non-preemptible batch 1-node holds kept running+pending at all times.
# INFRA/FAST may tune T1/P1/C1/T8/TB but must not lower IDLE_MIN/IDLE8_MIN.
T1=12; P1=8; C1=60; T8=3; TB=6; IDLE_MIN=1000000; IDLE8_MIN=1000000
