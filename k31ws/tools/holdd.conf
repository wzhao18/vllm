# holdd-ws.conf (sourced every loop). 2026-11-18 user: cancelling nodes while work is queued is unacceptable.
# Campaign policy: the daemon NEVER releases a running hold (idle limits effectively infinite); holds end only at their
# time limit. INFRA may tune the request side (T1/P1/C1/T8) but must not lower IDLE_MIN/IDLE8_MIN.
T1=8; P1=6; C1=60; T8=1; IDLE_MIN=1000000; IDLE8_MIN=1000000
